<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inscrição • ELAB</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="inscricao">
<main><div class="painel" style="max-width:560px">
  <h1 id="titulo">Inscrição</h1>
  <form novalidate>
    <label>Mensagem (opcional)<textarea name="mensagem" maxlength="500" placeholder="Conte um pouco sobre você e por que tem interesse."></textarea></label>
    <p class="erro" role="alert"></p>
    <button class="btn" id="enviar" type="submit">Enviar</button>
  </form></div></main>
<script src="js/app.js"></script>
</body>
</html>
