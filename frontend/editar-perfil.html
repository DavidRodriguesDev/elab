<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editar perfil • ELAB</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="editar">
<main><div class="painel" style="max-width:560px"><h1>Editar perfil</h1>
  <form novalidate>
    <label>Nome<input name="nome" required maxlength="80"></label>
    <label>Área de atuação<input name="area" maxlength="80"></label>
    <label>Cidade<input name="cidade" maxlength="80"></label>
    <label>Sobre você<textarea name="bio" maxlength="500"></textarea></label>
    <p class="erro" role="alert"></p>
    <button class="btn" type="submit">Salvar alterações</button> <a class="btn ghost" href="perfil.html">Cancelar</a>
  </form></div></main>
<script src="js/app.js"></script>
</body>
</html>
